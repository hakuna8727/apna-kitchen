<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Recipe</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo" style="margin-bottom: 12px;">
                <a href="/index.html" style="text-decoration: none; color: inherit;">
                    <h1><span style="background: linear-gradient(135deg, #e67e22 0%, #ff9800 100%); color: #fff; padding: 4px 8px; border-radius: 8px; margin-right: 10px; font-weight: 900; font-size: 0.95em; box-shadow: 0 4px 12px rgba(230, 126, 34, 0.3); display: inline-block; letter-spacing: 0.5px; border: 2px solid rgba(255, 255, 255, 0.2);">AK</span>APNA KITCHEN</h1>
                </a>
            </div>
            <ul id="main-nav">
                <li><a href="/recipes.html">All Recipes</a></li>
                <li><a href="/my-recipes.html">My Recipes</a></li>
                <li><a href="/submit-recipe.html">Submit a Recipe</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container">
            <h2>Edit Recipe</h2>
            <form id="edit-recipe-form">
                <input type="hidden" id="recipe-id">
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" required>
                
                <label for="category">Category:</label>
                <select id="category" name="category">
                    <option value="">-- Select category --</option>
                    <option value="soups">Soups</option>
                    <option value="stews">Stews & Curries</option>
                    <option value="grains">Grains & Starches</option>
                    <option value="baked">Baked Goods & Pastries</option>
                    <option value="meal">Meals</option>
                    <option value="salads">Salads & Sides</option>
                    <option value="desserts">Desserts</option>
                </select>
                
                <label for="description">Description:</label>
                <textarea id="description" name="description" required></textarea>
                
                <label for="ingredients">Ingredients:</label>
                <textarea id="ingredients" name="ingredients" required></textarea>
                
                <label for="instructions">Instructions:</label>
                <textarea id="instructions" name="instructions" required></textarea>
                
                <label for="imageUrl">Image URL (or choose file):</label>
                <input type="url" id="imageUrl" name="imageUrl" placeholder="https://example.com/photo.jpg">

                <label for="image-file">Choose image file:</label>
                <input type="file" id="image-file" name="imageFile" accept="image/*">

                <div id="image-preview-edit" style="margin-top:8px;"></div>
                
                <button type="submit">Update Recipe</button>
            </form>
            <div id="status-message"></div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 APNA KITCHEN. All rights reserved.</p>
    </footer>

    <script src="js/edit-recipe.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/image-input.js"></script>
</body>
</html>
