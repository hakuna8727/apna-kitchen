<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Your Recipe</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo">
                <a href="index.html">
                    <h1><span style="background: linear-gradient(135deg, #e67e22 0%, #ff9800 100%); color: #fff; padding: 4px 8px; border-radius: 8px; margin-right: 10px; font-weight: 900; font-size: 0.95em; box-shadow: 0 4px 12px rgba(230, 126, 34, 0.3); display: inline-block; letter-spacing: 0.5px; border: 2px solid rgba(255, 255, 255, 0.2);">AK</span>APNA KITCHEN</h1>
                </a>
            </div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="recipes.html">Recipes</a></li>
                <li><a href="submit-recipe.html">Submit a Recipe</a></li>
                <li><a href="about.html">About Us</a></li>
                <li id="login-link"><a href="login.html">Login</a></li>
                <li id="register-link"><a href="register.html">Register</a></li>
                <li id="logout-link" style="display:none;"><a href="/logout">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="submit-form">
            <h2>Share Your Recipe</h2>
            <form action="/submit-recipe" method="POST" enctype="multipart/form-data">
                <label for="recipe-title">Recipe Title:</label>
                <input type="text" id="recipe-title" name="title" required>

                <label for="recipe-category">Category:</label>
                <select id="recipe-category" name="category" required>
                    <option value="">-- Select category --</option>
                    <option value="soups">Soups</option>
                    <option value="stews">Stews & Curries</option>
                    <option value="grains">Grains & Starches</option>
                    <option value="baked">Baked Goods & Pastries</option>
                    <option value="meal">Meals</option>
                    <option value="salads">Salads & Sides</option>
                    <option value="desserts">Desserts</option>
                </select>

                <label for="recipe-description">Description:</label>
                <textarea id="recipe-description" name="description" rows="4" required></textarea>

                <label for="ingredients">Ingredients (one per line):</label>
                <textarea id="ingredients" name="ingredients" rows="6" required></textarea>

                <label for="instructions">Instructions:</label>
                <textarea id="instructions" name="instructions" rows="8" required></textarea>

                <label for="recipe-image">Image URL (or choose file):</label>
                <input type="text" id="recipe-image" name="imageUrl" placeholder="https://example.com/photo.jpg">

                <label for="recipe-file">Choose image file:</label>
                <input type="file" id="recipe-file" name="imageFile" accept="image/*">

                <div id="image-preview" style="margin-top:8px;"></div>

                <button type="submit" class="submit-button">Submit Recipe</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Recipe Share Hub. All rights reserved.</p>
    </footer>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const loginLink = document.getElementById('login-link');
        const registerLink = document.getElementById('register-link');
        const logoutLink = document.getElementById('logout-link');

        fetch('/api/user/status', {
            credentials: 'include'  // Include session cookie
        })
            .then(response => response.json())
            .then(data => {
                if (data.isLoggedIn) {
                    registerLink.style.display = 'none';
                    loginLink.innerHTML = `<a href="#">${data.username}</a>`;
                    logoutLink.style.display = 'block'; // Show the logout link
                } else {
                    loginLink.innerHTML = `<a href="/login.html">Login</a>`;
                    registerLink.style.display = 'block';
                    logoutLink.style.display = 'none'; // Hide the logout link
                }
            })
            .catch(error => {
                console.error('Error fetching user status:', error);
                loginLink.innerHTML = `<a href="/login.html">Login</a>`;
                registerLink.style.display = 'block';
                logoutLink.style.display = 'none';
            });
    });
</script>
<script src="js/nav.js"></script>
<script src="js/image-input.js"></script>
</body>
</html>
